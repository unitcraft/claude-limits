# claude-limits.toml -- accounts and polling for scripts/claude_limits.py.
# Copy to claude-limits.toml in the repository root (that name is gitignored:
# it lists your own login directories) and edit.

# Seconds between snapshots in --daemon mode.
interval_sec = 300

# Пороги цвета ЗАЛИВКИ бара (текущего процента): желтый и красный.
# Призрак прогноза использует свои пороги в [forecast] ниже.
[thresholds]
warning = 70
critical = 90

# Progress bar glyphs: "blocks" -> [████░░░░] (default), "ascii" -> [####....]
# If the block bar shows empty, the terminal font has no block glyphs: turn off
# terminal GPU acceleration or pick a font with them (see the README), or set
# "ascii" here.
bar_style = "blocks"

# Individual login directories. "~" expands to the home directory.
# The default Claude Code login lives in ~/.claude (its .claude.json sits
# beside it); the default Kimi Code home is ~/.kimi-code (or $KIMI_CODE_HOME).
# A login inside WSL is reachable through its UNC path; single quotes keep the
# backslashes literal in TOML:
#   { dir = '\\wsl.localhost\<distro>\home\<user>\.claude', kind = "claude" }
# Every entry MUST be a table with an explicit kind: "claude" looks for
# .credentials.json, "kimi" for credentials/*.json, "auto" accepts either.
# children = true takes every child directory of dir -- the multi-account
# layout, one CLAUDE_CONFIG_DIR (or Kimi Code home) per child:
#   { dir = "D:/accounts", kind = "claude", children = true }
accounts = [
    { dir = "~/.claude", kind = "claude" },
    { dir = "~/.kimi-code", kind = "kimi" },
    { dir = "D:/accounts", kind = "claude", children = true },
]

# Прогноз (spec 01.1 §5.3/§2.7): «призрак» бара показывает, сколько процентов
# будет к моменту сброса при текущем расходе; вторая строка под баром — исход.
# working_hours = true считает неделю и месяц по рабочему графику ниже;
# по умолчанию выключено — все окна считаются по календарю, как сессия.
# warning/critical — пороги ЦВЕТА ПРИЗРАКА (проекции), свои и мягче заливки:
# 80/95 по умолчанию — тень не кричит «жёлтый» задолго до реальной беды.
[forecast]
enabled = true
working_hours = false
work_days = ["mon", "tue", "wed", "thu", "fri"]
work_from = "09:00"
work_to = "19:00"
off_hours_rate = 0
rate_window_days = 3
warning = 80
critical = 95

# ---------------------------------------------------------------- refresh --
# An expired login is renewed by starting Claude Code under it, which rewrites
# its own .credentials.json -- the tool never writes that file itself. Owner's
# decision 2026-09-16: the daemon does this, instead of printing advice for a
# human to follow.
#
# IT COSTS ONE SMALL REQUEST on that account's own limits, which is the resource
# this tool exists to watch, so every knob below is about spending less of it.

# false -> report an expired login and renew nothing (--no-auto-refresh).
auto_refresh = true

# true -> renew EVERY expired directory. Default false: only the ones that block
# a reading. An account that still reports numbers through another directory is
# left alone -- silencing a parenthetical note is not worth a request.
refresh_all_expired = false

# The throwaway request, CLAUDE REFRESHES ONLY: Claude Code is started to
# rewrite its own token and the request spends that account's quota, so the
# model is the cheapest one that can answer "ok". Kimi renews by an OAuth
# token grant against auth.kimi.com -- no model, no quota spent.
refresh_claude_model = "claude-haiku-4-5-20251001"

# Limit per directory. A `claude` that hangs is killed and reported.
refresh_timeout_sec = 120

# Floor between two attempts on ONE directory. A login that cannot be renewed --
# revoked, logged out -- would otherwise cost a request every single cycle.
refresh_cooldown_sec = 3600

