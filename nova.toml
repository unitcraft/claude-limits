# nova.toml — claude-limits: usage limits of several Claude accounts.
#
# Layout: FLAT FOR NOW, MOVING TO `src/` — decision recorded in plan 01 §3.2.
#
# The line that stood here repeated the cancelled rule verbatim ("package root IS
# the source root, no separate `src/`"). Found 2026-09-07 by the technique window
# 283 used on the same class: grep for the DATE of the cancelled decision
# (2026-05-22) instead of guessing directories — a text that outlived a decision
# carries that date, while its directory has to be guessed. The rule was cancelled
# by the Plan 195 amendment, spec/decisions/07-modules.md:1112-1122, which makes
# `[lib] src = "src"` the standard layout for new packages and leaves the flat one
# legal but not recommended (registry №1026 covers the stale texts in nova).
#
# Why the move has not happened yet, and why the manifest still points at the flat
# path: it changes module declarations, and only the compiler confirms their form —
# it corrected my guess twice on T0.0 via E_D78_MODULE_PATH_MISMATCH. Plan 01 §3.2
# says the move travels WITH a build in one slot, not "move now, verify later", so
# the path below names the file that actually exists today. The machine is under
# the integrator's gate; the move and its build go in the next slot together.
#
# Dependencies are pulled by SEMVER RANGE, not by a pinned tag: the resolver takes
# the newest matching tag, which is how every sibling package is consumed
# (AGENTS.md, "Satellite package repositories"). Newest tags observed 2026-09-07:
# nova-http v0.1.3, nova-polaris v0.1.7, nova-tls v0.1.8 — recorded for provenance
# only; `nova.lock.toml` is what actually fixes the build.
#
# `duckdb` (plan 01.4) and `sdl` (plan 01 Ф.3) are NOT here yet: those packages do
# not exist, and a manifest naming a missing dependency breaks every build. They
# arrive with the tasks that create them.

[package]
name = "claude_limits"
version = "0.0.0"
description = "Usage limits of several Claude accounts: local backend with a browser page, optional always-on-top widget"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unitcraft/claude-limits"

# [[bin]] — ОБЪЯВЛЕНА СПЕКОЙ, НО ЕЩЁ НЕ РЕАЛИЗОВАНА В КОМПИЛЯТОРЕ (реестр №1027).
# Замер 2026-09-07 (вопрос владельца «реально в бин?»). ПОПРАВКА К ПЕРВОЙ РЕДАКЦИИ
# ЭТОГО КОММЕНТАРИЯ: я записал находку как «гид учит несуществующему» и был неправ —
# рамку перевернул интегратор, и спека это подтверждает. Секцию объявляет СПЕКА,
# нормативно: spec/decisions/07-modules.md:1076 (пример), :1097-1099 («array of
# tables — позволяет несколько бинарей в одном пакете»), :1134, :1731. Значит гид
# (docs/guide/authoring-a-module.md:66-68, :77) ВЕРЕН, а не реализован компилятор:
# `grep '"bin"'` по manifest.rs даёт 0, по nova-cli/src тоже пусто.
#
# ПОЧЕМУ ЭТО МОЛЧИТ: парсер манифеста игнорирует незнакомые ключи НАМЕРЕННО —
# manifest.rs:601 и :610, `_ => {} // ignore unknown keys для forward-compat`.
# Сигнала не будет ни от кода, ни от ошибки: секция принимается и не делает ничего.
#
# ПОЭТОМУ: путь передаётся ЯВНО — `./nova.sh build --mode release src/main.nv -o …`;
# `nova build` без пути точку входа не найдёт. Секция оставлена как единственная
# запись о точке входа и как готовность к тому дню, когда её начнут читать.
[[bin]]
name = "claude-limits"
path = "bin/claude_limits.nv"   # becomes src/bin/claude_limits.nv with the move

[dependencies]
http = { git = "https://github.com/nv-lang/nova-http", version = "0.1" }
polaris = { git = "https://github.com/nv-lang/nova-polaris", version = "0.1" }
tls = { git = "https://github.com/nv-lang/nova-tls", version = "0.1" }
